spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://paycraft-prod-aaltoo.h.aivencloud.com:24416/${DATABASE_NAME:defaultdb}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PROD_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration/mysql
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        show_sql: true
logging:
  file:
    name: log/paycraft-service.log
  level:
    org:
      springframework:
        security: DEBUG

secret-string: ${SECRET_STRING}

kora-secret: ${KORA_SECRET_KEY}
kora-public: ${KORA_PUBLIC_KEY}
encryption-key: ${ENCRYPTION_KEY}
webhook-dev-url: ${WEBHOOK_URL}

server:
  port: 6090
  error:
    include-message: always