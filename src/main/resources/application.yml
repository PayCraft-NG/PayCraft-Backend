spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Pre-Flyway Hibernate schema
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: smtp.gmail.com 
    port: 465
    username: ${EMAIL_SENDER}
    password: ${EMAIL_PASSWORD}
    enable: true
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
  application:
    name: PayCraft
  profiles:
    active: dev

payroll:
  job:
    fixedRate: 300000

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}