spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Pre-Flyway Hibernate schema
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    enable: true
  application:
    name: PayCraft
  profiles:
    active: dev

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${EMAIL_SENDER}

payroll:
  job:
    fixedRate: 300000

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}