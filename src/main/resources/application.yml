spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    enable: true
  application:
    name: PayCraft
  profiles:
    active: dev

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${EMAIL_SENDER}

auth:
  cookie:
    access-token-name: accessToken
    refresh-token-name: refreshToken
    secure: false
    same-site: Lax

payroll:
  job:
    fixedRate: 300000

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}