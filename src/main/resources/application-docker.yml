# Docker Compose: PostgreSQL + app. Activate with SPRING_PROFILES_ACTIVE=docker
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:paycraft}
    username: ${DATABASE_USERNAME:paycraft}
    password: ${DATABASE_PASSWORD:paycraft}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Pre-Flyway Hibernate schema
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: INFO

secret-string: ${SECRET_STRING}
kora-secret: ${KORA_SECRET_KEY}
webhook-url: ${WEBHOOK_URL:http://localhost:6020}
encryption-key: ${ENCRYPTION_KEY}
kora-public: ${KORA_PUBLIC_KEY}
webhook-dev-url: ${WEBHOOK_DEV_URL:http://localhost:6020/webhook/}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

management:
  health:
    mail:
      enabled: false

server:
  port: 6020
  error:
    include-message: always
