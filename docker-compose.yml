# Local stack: PostgreSQL + PayCraft API (Spring profile `docker`).
# Usage:
#   docker compose up --build
# Override secrets via environment or a .env file (see README).
#
# JWT: SECRET_STRING must be Base64 (e.g. openssl rand -base64 32).

services:
  postgres:
    image: postgres:16-alpine
    container_name: paycraft-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paycraft}
      POSTGRES_USER: ${POSTGRES_USER:-paycraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paycraft}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - paycraft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paycraft} -d ${POSTGRES_DB:-paycraft}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: paycraft-backend:local
    container_name: paycraft-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-6020}:6020"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-paycraft}
      DATABASE_USERNAME: ${POSTGRES_USER:-paycraft}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-paycraft}
      # Base64-encoded HMAC key (required by JWTService)
      SECRET_STRING: ${SECRET_STRING:-MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=}
      KORA_SECRET_KEY: ${KORA_SECRET_KEY:-change-me}
      KORA_PUBLIC_KEY: ${KORA_PUBLIC_KEY:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-char-key-material!!}
      EMAIL_SENDER: ${EMAIL_SENDER:-noreply@example.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-change-me}
      SPRING_MAIL_ENABLE: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:6020}
      WEBHOOK_DEV_URL: ${WEBHOOK_DEV_URL:-http://localhost:6020/webhook/}

volumes:
  paycraft_pgdata:
